name: Funktion vorschlagen
description: Ideen oder Erweiterungswünsche für Agriculture Science
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Betroffenes System
      options:
        - APS
        - ASS
        - LEGS / SmartGate
        - Gesamtes Paket
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Gewünschte Funktion
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Anwendungsfall und Nutzen
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Weitere Informationen
